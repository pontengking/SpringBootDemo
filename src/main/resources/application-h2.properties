#spring.datasource.url=jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:mem:TESTDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# The SQL script owns the schema. Hibernate checks it instead of creating it again.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init_db.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=validate
