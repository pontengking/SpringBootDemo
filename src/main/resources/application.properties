# Local runs use an in-memory database; select mariadb explicitly for persistent data.
spring.profiles.default=h2
spring.application.name=book-ordering
spring.jpa.open-in-view=false
spring.security.user.name=${APP_USER:book}
spring.security.user.password=${APP_PASSWORD:book}
external.page-url=${EXTERNAL_PAGE_URL:https://www.google.com}
# Log appenders (console + rolling file) and layout are defined in logback-spring.xml.
# This level is read by logback-spring.xml via springProperty; raise it to DEBUG to see controller traces.
logging.level.com.example.bookorder=${HTTP_LOG_LEVEL:INFO}
